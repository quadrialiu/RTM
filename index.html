<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Pins</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #auth {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #fff;
      padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
      display: flex; gap: 6px; align-items: center; font-size: 14px;
    }
    #auth input { flex: 1; min-width: 0; }
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
      background: #fff; padding: 12px; box-shadow: 0 -2px 10px rgba(0,0,0,.25);
      display: grid; gap: 8px; max-width: 500px; margin: 0 auto;
      border-radius: 12px 12px 0 0;
    }
    input, select, textarea, button {
      font-size: 16px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box;
    }
    #panel input, #panel select, #panel textarea, #panel button { width: 100%; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
    button:disabled { background: #999; }
    button.danger { background: #dc2626; margin-left: 6px; }
    #searchRow { display: flex; gap: 6px; }
    #searchRow button { width: auto; }
    #hint { font-size: 14px; color: #555; margin: 0; }
    #panel.closed { display: none; }
    #results { max-height: 180px; overflow-y: auto; }
    #results:empty { display: none; }
    .result { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 15px; cursor: pointer; }
    .result:active { background: #eef3ff; }
    #fab { position: fixed; right: 16px; bottom: 24px; z-index: 1000; border-radius: 28px;
      padding: 12px 18px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    #modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; }
    #modal.closed { display: none; }
    #modal .card { background: #fff; padding: 16px; border-radius: 12px; width: 90%;
      max-width: 360px; display: grid; gap: 8px; }
    #modal input, #modal button { width: 100%; }
    button.secondary { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
    .fields { display: grid; gap: 6px; }
    .fields label, .note { font-size: 13px; color: #555; margin: 0; }
    #quick { display: flex; gap: 6px; }
    #quick button { flex: 1; width: auto; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="auth"></div>

  <button id="fab">+ Add pin</button>

  <div id="modal" class="closed">
    <div class="card">
      <h3 style="margin:0">Welcome to Live Pins</h3>
      <input id="em" type="email" placeholder="Email" autocomplete="email">
      <input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
      <button id="signin">Sign in</button>
      <button id="signup" class="secondary">Create account</button>
      <button id="google" class="secondary">Continue with Google</button>
      <button id="cancel" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="panel" class="closed">
    <button id="closePanel" class="secondary">Close</button>
    <div id="searchRow">
      <input id="search" placeholder="Search an address or tap the map">
      <button id="searchBtn">Go</button>
    </div>
    <div id="results"></div>
    <p id="hint">Tap the map or search to choose a location.</p>
    <select id="type">
      <option value="event">Event</option>
      <option value="quest">Side Quest</option>
    </select>
    <input id="title" placeholder="Title" maxlength="80">
    <textarea id="desc" placeholder="Description (optional)" rows="2" maxlength="300"></textarea>
    <input id="max" type="number" min="1" placeholder="Spots for others (optional)">
    <div id="questFields" class="fields">
      <label>Pin disappears at</label>
      <input id="questExpiry" type="datetime-local">
      <div id="quick">
        <button type="button" class="secondary" data-h="1">1 hour</button>
        <button type="button" class="secondary" data-h="3">3 hours</button>
        <button type="button" class="secondary" id="tonight">Tonight</button>
      </div>
    </div>
    <div id="eventFields" class="fields">
      <label>Starts</label>
      <input id="evStart" type="datetime-local">
      <label>Ends</label>
      <input id="evEnd" type="datetime-local">
      <label>Remove the pin when the event</label>
      <select id="evRemove">
        <option value="begin">begins</option>
        <option value="end" selected>ends</option>
      </select>
    </div>
    <input id="contact" maxlength="100" placeholder="Contact, e.g. @name on Instagram (optional)">
    <p class="note">Only signed-in users can see your contact. Share only what you are comfortable with.</p>
    <button id="submit">Drop pin</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // ---- 1. Connect to Supabase ----
    const SUPABASE_URL = 'https://ygtaomhhuizqiedlvbwf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lbCUe4xmCRuR0X5Jc_pOqQ_HhXWe1LC'; // anon / publishable key only
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---- 2. Sign-in (email magic link) ----
    let user = null;
    const authBox = document.getElementById('auth');
    const modal = document.getElementById('modal');

    function renderAuth() {
      authBox.replaceChildren();
      if (user) {
        const who = document.createElement('span');
        who.style.flex = '1';
        who.textContent = 'Signed in: ' + user.email;
        const out = document.createElement('button');
        out.textContent = 'Sign out';
        out.onclick = () => db.auth.signOut();
        authBox.append(who, out);
      } else {
        const label = document.createElement('span');
        label.style.flex = '1';
        label.textContent = 'Live Pins';
        const go = document.createElement('button');
        go.textContent = 'Sign in / Sign up';
        go.onclick = () => modal.classList.remove('closed');
        authBox.append(label, go);
      }
    }

    const redirectTo = window.location.origin + window.location.pathname;
    const emailEl = document.getElementById('em'), pwEl = document.getElementById('pw');
    document.getElementById('cancel').onclick = () => modal.classList.add('closed');
    document.getElementById('signin').onclick = async () => {
      const { error } = await db.auth.signInWithPassword({ email: emailEl.value.trim(), password: pwEl.value });
      if (error) alert(error.message);
    };
    document.getElementById('signup').onclick = async () => {
      const { data, error } = await db.auth.signUp({
        email: emailEl.value.trim(), password: pwEl.value, options: { emailRedirectTo: redirectTo }
      });
      if (error) { alert(error.message); return; }
      if (!data.session) alert('Account created. Check your email to confirm it, then sign in.');
    };
    document.getElementById('google').onclick = () =>
      db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });

    db.auth.onAuthStateChange((event, session) => {
      user = session ? session.user : null;
      if (user) modal.classList.add('closed');
      contacts = {};
      renderAuth();
      for (const id in markers) refreshPopup(id);
    });

    // ---- 3. Map ----
    const map = L.map('map', { zoomControl: false }).setView([-20.25, 57.55], 10);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // ---- 4. Choosing a location (tap or search) ----
    let chosen = null, chosenMarker = null;
    function choose(latlng) {
      chosen = latlng;
      if (chosenMarker) chosenMarker.remove();
      chosenMarker = L.marker(latlng).addTo(map);
      document.getElementById('hint').textContent =
        'Location chosen: ' + latlng.lat.toFixed(4) + ', ' + latlng.lng.toFixed(4);
    }
    const panel = document.getElementById('panel');
    const fab = document.getElementById('fab');
    const typeEl = document.getElementById('type');
    const questExpiry = document.getElementById('questExpiry');
    const evStart = document.getElementById('evStart');
    const evEnd = document.getElementById('evEnd');
    const evRemove = document.getElementById('evRemove');
    const contactEl = document.getElementById('contact');

    const pad = (n) => String(n).padStart(2, '0');
    // Format a Date the way <input type="datetime-local"> expects (local time)
    function toInput(d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function setDefaults() {
      const now = Date.now();
      questExpiry.value = toInput(new Date(now + 3 * 3600000));
      evStart.value = toInput(new Date(now + 3600000));
      evEnd.value = toInput(new Date(now + 4 * 3600000));
    }
    function updateFormType() {
      const isQuest = typeEl.value === 'quest';
      document.getElementById('questFields').style.display = isQuest ? 'grid' : 'none';
      document.getElementById('eventFields').style.display = isQuest ? 'none' : 'grid';
    }
    typeEl.addEventListener('change', updateFormType);
    document.querySelectorAll('#quick [data-h]').forEach((btn) => {
      btn.onclick = () => { questExpiry.value = toInput(new Date(Date.now() + btn.dataset.h * 3600000)); };
    });
    document.getElementById('tonight').onclick = () => {
      const d = new Date();
      d.setHours(23, 59, 0, 0);
      if (d - Date.now() < 30 * 60000) d.setDate(d.getDate() + 1); // too close to midnight: use tomorrow night
      questExpiry.value = toInput(d);
    };
    updateFormType();
    setDefaults();

    function setPanel(open) {
      panel.classList.toggle('closed', !open);
      if (open) setDefaults();
      fab.style.display = open ? 'none' : 'block';
      if (!open && chosenMarker) { chosenMarker.remove(); chosenMarker = null; chosen = null; }
    }
    fab.onclick = () => { if (user) setPanel(true); else modal.classList.remove('closed'); };
    document.getElementById('closePanel').onclick = () => setPanel(false);
    map.on('click', (e) => { if (!panel.classList.contains('closed')) choose(e.latlng); });

    // ---- Search with suggestions (Photon, built on OpenStreetMap) ----
    const searchEl = document.getElementById('search');
    const resultsEl = document.getElementById('results');
    let searchTimer, searchSeq = 0, lastResults = [];

    // Turn a result into readable text, e.g. "Caudan Waterfront, Port Louis"
    function labelFor(p) {
      const parts = [p.name, p.street, p.district, p.city].filter(Boolean);
      return [...new Set(parts)].join(', ');
    }

    function showResults(features) {
      resultsEl.replaceChildren();
      lastResults = features;
      features.forEach((f) => {
        const row = document.createElement('div');
        row.className = 'result';
        row.textContent = labelFor(f.properties);
        row.onclick = () => pick(f);
        resultsEl.append(row);
      });
    }

    // Choosing a result moves the map there and picks the location
    function pick(f) {
      const [lng, lat] = f.geometry.coordinates; // Photon gives longitude first
      const latlng = L.latLng(lat, lng);
      searchEl.value = labelFor(f.properties);
      resultsEl.replaceChildren();
      lastResults = [];
      map.setView(latlng, 16);
      choose(latlng);
    }

    async function searchPlaces(q) {
      const seq = ++searchSeq;
      const url = 'https://photon.komoot.io/api/?limit=6&lat=-20.25&lon=57.55'
        + '&bbox=57.2,-20.6,57.9,-19.9&q=' + encodeURIComponent(q);
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (seq !== searchSeq) return; // a newer search has replaced this one
        showResults(data.features || []);
      } catch (err) { /* network hiccup: keep the current list */ }
    }

    // Wait 300ms after the last keystroke so we don't search on every letter
    searchEl.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = searchEl.value.trim();
      if (q.length < 3) { searchSeq++; lastResults = []; resultsEl.replaceChildren(); return; }
      searchTimer = setTimeout(() => searchPlaces(q), 300);
    });

    // "Go" picks the top suggestion
    document.getElementById('searchBtn').onclick = () => {
      if (lastResults.length) pick(lastResults[0]);
      else alert('Type at least 3 letters and wait for suggestions.');
    };

    // ---- 5. Showing pins and joins ----
    const COLORS = { event: '#2563eb', quest: '#f97316' };
    const pins = {};    // pin id -> pin data
    const markers = {}; // pin id -> { marker, expires }
    const joins = {};   // pin id -> Set of user ids

    const FMT = { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' };
    function fmt(v) { return new Date(v).toLocaleString([], FMT); }
    function whenText(pin) {
      if (!pin.start_time) return 'Disappears ' + fmt(pin.expires_at);
      let text = 'Starts ' + fmt(pin.start_time);
      if (pin.end_time) text += ' · ends ' + fmt(pin.end_time);
      const atStart = new Date(pin.expires_at).getTime() === new Date(pin.start_time).getTime();
      return text + ' · pin disappears when it ' + (atStart ? 'begins' : 'ends');
    }

    // Contacts live in their own table that only signed-in users can read
    let contacts = {};
    async function loadContact(id) {
      if (!user || contacts[id] !== undefined) return;
      const { data } = await db.from('pin_contacts').select('contact').eq('pin_id', id).maybeSingle();
      contacts[id] = data ? data.contact : null;
      refreshPopup(id);
    }

    function buildPopup(pin) {
      const set = joins[pin.id] || new Set();
      const box = document.createElement('div');
      const h = document.createElement('strong'); h.textContent = pin.title;
      const t = document.createElement('div'); t.textContent = pin.type === 'event' ? 'Event' : 'Side Quest';
      const d = document.createElement('p'); d.textContent = pin.description || '';
      const e = document.createElement('small'); e.textContent = whenText(pin);
      const k = document.createElement('p');
      k.textContent = (user && contacts[pin.id]) ? 'Contact: ' + contacts[pin.id] : '';
      if (!k.textContent) k.style.display = 'none';
      const c = document.createElement('p');
      c.textContent = set.size + (pin.max_people ? ' / ' + pin.max_people : '') + ' joined';
      const b = document.createElement('button');
      if (!user) { b.textContent = 'Sign in to join'; b.onclick = () => modal.classList.remove('closed'); }
      else { b.textContent = set.has(user.id) ? 'Leave' : "I'm in"; b.onclick = () => toggleJoin(pin); }
      const isHost = user && pin.created_by === user.id;
      if (isHost) {
        const hostNote = document.createElement('p');
        hostNote.textContent = 'You are hosting this pin.';
        box.append(h, t, d, e, k, c, hostNote);
      } else {
        box.append(h, t, d, e, k, c, b);
      }
      if (user && pin.created_by === user.id) {
        const del = document.createElement('button');
        del.textContent = 'Delete pin';
        del.className = 'danger';
        del.onclick = () => deletePin(pin);
        box.append(del);
      }
      return box;
    }

    function refreshPopup(id) {
      const m = markers[id];
      if (m && m.marker.isPopupOpen()) m.marker.setPopupContent(buildPopup(pins[id]));
    }

    function addPin(pin) {
      if (markers[pin.id] || new Date(pin.expires_at) <= new Date()) return;
      pins[pin.id] = pin;
      const marker = L.circleMarker([pin.lat, pin.lng], {
        radius: 10, color: '#fff', weight: 2, fillColor: COLORS[pin.type], fillOpacity: 1
      }).addTo(map);
      marker.bindPopup(buildPopup(pin));
      marker.on('popupopen', () => { marker.setPopupContent(buildPopup(pin)); loadContact(pin.id); });
      markers[pin.id] = { marker, expires: new Date(pin.expires_at) };
    }

    // Remove a pin from the map and from the app's memory
    function removePin(id) {
      const m = markers[id];
      if (m) m.marker.remove();
      delete markers[id];
      delete pins[id];
      delete joins[id];
    }

    async function deletePin(pin) {
      if (!confirm('Delete "' + pin.title + '"? This cannot be undone.')) return;
      // .select() returns the rows that were actually deleted
      const { data, error } = await db.from('pins').delete().eq('id', pin.id).select();
      if (error) { alert('Could not delete: ' + error.message); return; }
      if (!data.length) { alert('You can only delete your own pins.'); return; }
      removePin(pin.id);
    }

    async function toggleJoin(pin) {
      if (pin.created_by === user.id) return; // hosts don't join their own pins
      const set = joins[pin.id] || (joins[pin.id] = new Set());
      if (set.has(user.id)) {
        const { error } = await db.from('joins').delete().eq('pin_id', pin.id).eq('user_id', user.id);
        if (error) { alert(error.message); return; }
        set.delete(user.id);
      } else {
        if (pin.max_people && set.size >= pin.max_people) { alert('This one is full.'); return; }
        const { error } = await db.from('joins').insert({ pin_id: pin.id, user_id: user.id });
        if (error) { alert(error.message); return; }
        set.add(user.id);
      }
      refreshPopup(pin.id);
    }

    async function loadAll() {
      const p = await db.from('pins').select('*').gt('expires_at', new Date().toISOString());
      if (p.error) { console.error(p.error); return; }
      const j = await db.from('joins').select('pin_id, user_id');
      if (!j.error) j.data.forEach(r => (joins[r.pin_id] || (joins[r.pin_id] = new Set())).add(r.user_id));
      p.data.forEach(addPin);
    }

    // Remove expired pins from the map every minute
    setInterval(() => {
      const now = new Date();
      for (const id in markers) {
        if (markers[id].expires <= now) { markers[id].marker.remove(); delete markers[id]; }
      }
    }, 60000);

    // ---- 6. Live updates ----
    db.channel('live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pins' },
          (payload) => addPin(payload.new))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'pins' },
          (payload) => removePin(payload.old.id))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'joins' },
          (payload) => {
            const r = payload.new;
            (joins[r.pin_id] || (joins[r.pin_id] = new Set())).add(r.user_id);
            refreshPopup(r.pin_id);
          })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'joins' },
          (payload) => {
            const r = payload.old;
            if (joins[r.pin_id]) joins[r.pin_id].delete(r.user_id);
            refreshPopup(r.pin_id);
          })
      .subscribe();

    // ---- 7. Saving a new pin ----
    document.getElementById('submit').onclick = async () => {
      if (!user) { alert('Sign in first (top of the screen).'); return; }
      const title = document.getElementById('title').value.trim();
      if (!chosen) { alert('Choose a location first.'); return; }
      if (!title) { alert('Add a title.'); return; }
      const type = typeEl.value;
      const max = parseInt(document.getElementById('max').value, 10);
      const now = Date.now();
      let start = null, end = null, expires;

      if (type === 'quest') {
        expires = new Date(questExpiry.value);
        if (isNaN(expires)) { alert('Pick when the pin should disappear.'); return; }
      } else {
        start = new Date(evStart.value);
        if (isNaN(start)) { alert('Pick a start date and time.'); return; }
        if (start.getTime() <= now) { alert('The start must be in the future.'); return; }
        if (evEnd.value) {
          end = new Date(evEnd.value);
          if (end <= start) { alert('The end must be after the start.'); return; }
        }
        if (evRemove.value === 'end') {
          if (!end) { alert('Add an end time, or choose to remove the pin when the event begins.'); return; }
          expires = end;
        } else {
          expires = start;
        }
      }
      if (expires.getTime() <= now) { alert('The pin must disappear at a future time.'); return; }
      if (expires.getTime() - now > 30 * 86400000) { alert('Pins can last at most 30 days.'); return; }

      const contact = contactEl.value.trim();
      const { data: row, error } = await db.from('pins').insert({
        type,
        title,
        description: document.getElementById('desc').value.trim() || null,
        lat: chosen.lat,
        lng: chosen.lng,
        max_people: max > 0 ? max : null,
        start_time: start ? start.toISOString() : null,
        end_time: end ? end.toISOString() : null,
        expires_at: expires.toISOString()
      }).select().single();
      if (error) { alert('Could not save: ' + error.message); return; }
      if (contact) {
        const c = await db.from('pin_contacts').insert({ pin_id: row.id, contact });
        if (c.error) alert('Pin saved, but the contact could not be saved: ' + c.error.message);
      }
      document.getElementById('title').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('max').value = '';
      contactEl.value = '';
      setPanel(false);
      document.getElementById('hint').textContent = 'Tap the map or search to choose a location.';
    };

    renderAuth();
    loadAll();
  </script>
</body>
</html>
